<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed In Use, The Custody Vault</title>
<meta name="description" content="Walk a PSBT across an air gap and see how one signer differs from a multi-vendor quorum.">
<link rel="preload" href="butler-host-v2.webp" as="image">
<link rel="stylesheet" href="scene-shared.css?v=4">
</head>
<body>
<canvas id="c"></canvas>
<div class="butler-host" aria-hidden="true"><img src="butler-host-v2.webp" alt=""><span class="tray-prop" id="tray-prop"></span></div>
<div class="hud top">
  <div class="nav">
    <a href="index.html"><img src="logo.png" alt="Bitcoin Butlers" class="logo"></a>
    <a class="scene-link" href="generation.html">Seed Generation</a>
    <a class="scene-link here" href="in-use.html">Seed In Use</a>
    <a class="scene-link" href="at-rest.html">Seed At Rest</a>
  </div>
  <a class="flat" href="fallback.html">2D version</a>
</div>
<div class="readout" id="readout">PSBT unsigned</div>
<div class="controls">
  <div class="grp"><div class="lbl">Seed format</div><div class="chips" id="fmt">
    <button class="chip on" data-v="bip39">BIP-39</button>
    <button class="chip" data-v="bip32">BIP-32</button>
    <button class="chip" data-v="codex32">Codex32</button>
  </div></div>
  <div class="grp"><div class="lbl">Watch-only device</div><div class="chips" id="platform">
    <button class="chip on" data-v="desktop">Desktop</button>
    <button class="chip" data-v="phone">Phone</button>
  </div>
  <div class="axis-note">This device builds and broadcasts the PSBT. It holds no private seed.</div>
  </div>
  <div class="grp"><div class="lbl">Signers</div><div class="chips" id="sig">
    <button class="chip on" data-v="single">Single</button>
    <button class="chip" data-v="multi">Multisig</button>
  </div></div>
  <div class="grp"><div class="lbl">Signer manufacturers</div><div class="chips" id="ven">
    <button class="chip on" data-v="one">Same maker</button>
    <button class="chip" data-v="multi">Mixed makers</button>
  </div>
  <div class="axis-note">Vendor diversity matters only when multiple signers form a quorum.</div>
  </div>
</div>
<div class="act"><button id="walk-psbt">Walk the PSBT</button></div>
<div class="caption"><div class="bubble"><span class="who">Your Butler</span><span id="say"></span></div></div>

      || document.createElement("canvas").getContext("webgl");
