<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Custody Vault, Bitcoin Butlers</title>
<meta name="description" content="Follow a Bitcoin seed through generation, signing, and recovery with a Butler as your guide.">
<link rel="preload" href="butler-host-v2.webp" as="image">
<link rel="stylesheet" href="scene-shared.css?v=6">
<style>
  body{background:
    radial-gradient(circle at 58% 42%,rgba(49,56,68,.38),transparent 34%),
    linear-gradient(145deg,#11161e 0%,#080b10 62%,#05070a 100%)}
  .landing-mark{position:fixed;left:1rem;top:.9rem;z-index:3}
  .landing-mark img{width:64px;height:auto}
  .landing-title{position:fixed;top:1.35rem;left:50%;transform:translateX(-50%);z-index:2;
    font-family:var(--sans);text-align:center;letter-spacing:.12em;text-transform:uppercase;
    color:var(--gold);font-size:.72rem;white-space:nowrap}
  .landing-title strong{display:block;color:var(--bone);font-family:var(--serif);
    font-size:clamp(1.4rem,3vw,2.15rem);font-weight:400;letter-spacing:.02em;
    text-transform:none;margin-top:.38rem}
  .lifecycle-links{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);
    z-index:4;display:flex;flex-direction:row;gap:.8rem;justify-content:center;
    width:min(760px,calc(100vw - 2rem))}
  .lifecycle-links a{flex:1;display:flex;align-items:center;justify-content:center;
    min-height:74px;font-family:var(--sans);font-size:.78rem;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink);background:var(--gold);border:1px solid var(--gold);
    border-radius:8px;padding:.85rem 1rem;text-decoration:none;white-space:nowrap;
    box-shadow:0 14px 34px rgba(0,0,0,.34);transition:transform .2s ease,background .2s ease}
  .lifecycle-links a:hover,.lifecycle-links a:focus-visible{transform:translateY(-3px);outline:none}
  .lifecycle-links a:nth-child(2),.lifecycle-links a:nth-child(3){
    color:var(--bone);background:rgba(21,26,34,.94)}
  @media(max-width:600px){
    .landing-title{top:5.9rem}
    .landing-title strong{font-size:1.15rem}
    .lifecycle-links{top:13rem;transform:translateX(-50%);width:min(290px,calc(100vw - 2rem));
      flex-direction:column;gap:.55rem}
    .lifecycle-links a{flex:none;min-height:52px;font-size:.68rem;padding:.65rem .8rem}
  }
</style>
</head>

<div class="butler-host" aria-hidden="true"><img src="butler-host-v2.webp" alt=""><span class="tray-prop" id="tray-prop"></span></div>
<a class="landing-mark" href="index.html"><img src="logo.png" alt="Bitcoin Butlers"></a>

<nav class="lifecycle-links" aria-label="Choose a seed lifecycle scene">

  <a href="in-use.html?station=4">In use</a>
  <a href="at-rest.html?station=10">At rest</a>
</nav>
<div class="caption"><div class="bubble"><span class="who">Your Butler</span><span id="say"></span></div></div>
<script type="module">
  import { speak } from "./butler.js?v=4";
  import { SCRIPTS } from "./script.js?v=6";
  speak(SCRIPTS.landing.welcome, 320);
</script>
</body>
</html>
